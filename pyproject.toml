[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codini"
version = "0.1.0"
description = "Small local coding agent"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "dotenv>=0.9.9",
    "rich>=15.0.0",
]

[project.scripts]
codini = "codini.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["codini*"]

[tool.setuptools.package-data]
"codini.viz" = ["templates/*.html"]
